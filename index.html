<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="SiteStyle.css">
    <title>Word Store</title>
</head>

<body>
    <header>
        <div class="logo">World Store</div>
        <nav>
            <ul>
                <li>Home</li>
                <li>Produtos</li>
                <li>Informações</li>
            </ul>
        </nav>
    </header>
    <main class="conteiner">
        <div class="Tech-Circle">
            <div class="Circle"></div>
            <div class="Circle"></div>
            <div class="Circle"></div>
            <div class="Circle"></div>
        </div>

        <div class="list">

            <div class="item active">

                <div class="product-image">
                    <img src="./fotos/Design sem nome (5) (1).png" alt="Imagem do Produto">
                </div>
                <div class="content">
                    <p class="Product-tag">Novos Lançamentos</p>
                    <p class="Product-name">Nome do Produto</p>
                    <p class="Description">
                        Descrição do Produto
                    </p>
                    <button Class="btn">Saiba mais</button>
                </div>

            </div>

            <div class="item">
                <div class="product-image">
                    <img src="./fotos/Design sem nome (3) (1).png" alt="Imagem do Produto">
                </div>
                <div class="content">
                    <p class="Product-tag">Som Premium</p>
                    <p class="Product-name">Nome do Produto</p>
                    <p class="Description">
                        Descrição do Produto
                    </p>
                    <button Class="btn">Saiba mais</button>
                </div>
            </div>

            <div class="item">
                <div class="product-image">
                    <img src="./fotos/Design sem nome (4) (1).png" alt="Imagem do Produto">
                </div>
                <div class="content">
                    <p class="Product-tag">Alta performance</p>
                    <p class="Product-name">Nome do Produto</p>
                    <p class="Description">
                        Descrição do Produto
                    </p>
                    <button Class="btn">Saiba mais</button>
                </div>
            </div>
        </div>

        <div class="arrows">
            <button class="arrows-btn" id="prev">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-caret-left-fill" viewBox="0 0 16 16">
                    <path
                        d="m3.86 8.753 5.482 4.796c.646.566 1.658.106 1.658-.753V3.204a1 1 0 0 0-1.659-.753l-5.48 4.796a1 1 0 0 0 0 1.506z" />
                </svg>
            </button>

            <button class="arrows-btn" id="next">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-caret-right-fill" viewBox="0 0 16 16">
                    <path
                        d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z" />
                </svg>
            </button>
        </div>

        <div class="Indicators">
            <div class="number">01</div>
            <div class="dots"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </main>
</body>

</html>
